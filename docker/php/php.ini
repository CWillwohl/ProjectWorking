[PHP]
expose_php = Off
memory_limit = 512M
post_max_size = 100M
upload_max_filesize = 100M
variables_order = EGPCS

[Date]
date.timezone = UTC

[opcache]
opcache.enable = 1
opcache.enable_cli = 1
; Code is edited live, so check for changes on every request
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

[xdebug]
; Enable with XDEBUG_MODE=debug in .env
xdebug.mode = off
xdebug.client_host = host.docker.internal
xdebug.start_with_request = trigger
