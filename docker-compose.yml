name: working

# Shared by the services that run the PHP image (app and queue)
x-php: &php
  build:
    context: .
    args:
      UID: ${HOST_UID:-1000}
      GID: ${HOST_GID:-1000}
  volumes:
    - .:/var/www/html
  extra_hosts:
    - host.docker.internal:host-gateway
  environment:
    XDEBUG_MODE: ${XDEBUG_MODE:-off}
    IGNITION_LOCAL_SITES_PATH: ${PWD}
    IGNITION_REMOTE_SITES_PATH: /var/www/html

services:
  app:
    <<: *php
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 10s
      timeout: 5s
      retries: 3
      # The first start runs composer install and the migrations
      start_period: 5m

  queue:
    <<: *php
    # queue:listen reloads the code for every job, so changes don't require a restart
    command: php artisan queue:listen --tries=3 --timeout=90
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    ports:
      - ${APP_PORT:-8000}:80
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  vite:
    image: node:22-alpine
    working_dir: /var/www/html
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    # Run the Vite binary directly so it receives SIGTERM and removes public/hot on shutdown
    command: sh -c "npm install && exec node_modules/.bin/vite"
    environment:
      HUSKY: 0
      VITE_PORT: ${VITE_PORT:-5173}
      npm_config_cache: /tmp/.npm
    ports:
      - ${VITE_PORT:-5173}:${VITE_PORT:-5173}
    volumes:
      - .:/var/www/html

  mysql:
    image: mysql:8.4
    ports:
      - ${FORWARD_DB_PORT:-3306}:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env (cp .env.dev .env)}
      MYSQL_DATABASE: ${DB_DATABASE:?Defina DB_DATABASE no .env (cp .env.dev .env)}
      MYSQL_USER: ${DB_USERNAME:?Defina DB_USERNAME no .env (cp .env.dev .env)}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh:ro
    healthcheck:
      # Check over TCP so the temporary server MySQL runs without networking
      # while initializing the volume is not reported as healthy
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - ${FORWARD_REDIS_PORT:-6379}:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - ${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025

volumes:
  mysql-data:
  redis-data:
